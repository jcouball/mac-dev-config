# sshd settings for every Mac this repo sets up. Managed: script 07 copies this
# file to /etc/ssh/sshd_config.d/00-mac-dev-config.conf on `chezmoi apply`, and
# an edit made there is overwritten by the next one. Change this file instead.
#
# Only what differs from macOS's sshd_config, which includes the drop-in
# directory before it sets anything. sshd keeps the first value it reads for a
# keyword, so these win over that file, and the 00- prefix puts them ahead of
# macOS's own drop-in, 100-macos.conf. README.md, "Remote access over SSH", has
# the reasoning.

# Keys only. A session logs in as james, an administrator, so
# ~/.ssh/authorized_keys is the only way in: no passwords, no host-based login,
# no certificates. AuthenticationMethods makes that true whatever the
# per-method settings say, Kerberos (GSSAPI) included.
AuthenticationMethods publickey
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
HostbasedAuthentication no
TrustedUserCAKeys none
AuthorizedPrincipalsFile none
AuthorizedKeysFile .ssh/authorized_keys

# root has no key file and never logs in over ssh. Use sudo from a session.
PermitRootLogin no

# No forwarding of any kind: ports, agent, X11, Unix sockets or tunnels. A
# key line's `restrict` says the same, and no key option can override this.
DisableForwarding yes

# Who may log in, and from where. macOS has no ufw to keep port 22 to the LAN,
# so sshd does it: an account and address not matched here is refused before
# its key is looked at.
#
#   james      from the home LAN, 192.168.0.0/16.
#   certuser   from 192.168.64.0/24, the network tart gives its VMs. The
#              account exists only in the certification VM, where certify.sh
#              logs in from the host at 192.168.64.1. No Mac has the account,
#              so on a Mac the entry admits nobody.
#
# Addresses are IPv4. A login over IPv6 is refused, which is why the Host
# blocks in ~/.ssh/config set `AddressFamily inet`.
AllowUsers james@192.168.0.0/16 certuser@192.168.64.0/24
